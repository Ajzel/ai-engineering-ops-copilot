[project]
name = "ai-engineering-ops-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ajzel", email = "139218824+Ajzel@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "langchain-groq>=1.1.3",
    "mcp-use>=1.7.0",
    "mcp[cli]>=1.28,<2",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-engineering-ops-copilot = "ai_engineering_ops_copilot:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]
